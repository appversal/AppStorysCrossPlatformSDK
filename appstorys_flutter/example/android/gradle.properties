org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Set to false to use locally-published shared-core (run :shared-core:publishToMavenLocal first).
# Set to true to use JitPack release.
useJitpackSharedCore=true
jitpackSharedCoreVersion=v4.0.0-alpha30
# Use the locally built shared-core version. Must match shared-core/build.gradle.kts
# Current version in shared-core/build.gradle.kts is 4.0.0-alpha04
localSharedCoreVersion=4.0.0-alpha04
