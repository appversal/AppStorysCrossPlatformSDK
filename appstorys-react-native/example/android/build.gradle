buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 22
        compileSdkVersion = 34
        targetSdkVersion = 34
        kotlinVersion = "2.1.20"
        reactNativeVersion = "0.73.0"
    }
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        // react-native AAR lives inside node_modules after npm install
        // rootDir = example/android, so ../node_modules = example/node_modules
        maven { url "$rootDir/../node_modules/react-native/android" }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven { url "$rootDir/../node_modules/react-native/android" }
        maven { url "$rootDir/../node_modules/jsc-android/dist" }
    }
    // RN 0.73 renamed the artifact from react-native to react-android.
    // Old libraries that still declare 'com.facebook.react:react-native:+' need this substitution.
    configurations.all {
        resolutionStrategy.dependencySubstitution {
            substitute(module("com.facebook.react:react-native"))
                .using(module("com.facebook.react:react-android:0.73.0"))
        }
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                buildFeatures { buildConfig true }
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
        // Align Kotlin JVM target with Java for all subprojects (Kotlin 2.x defaults to 21)
        project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions { jvmTarget = '17' }
        }
    }
}

// react-native-fs is an old library without a namespace in its build.gradle (required by AGP 8+)
project(':react-native-fs') {
    afterEvaluate {
        android {
            namespace 'com.rnfs'
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
